<!doctype html>
<!--
  web-mandala · coloreador de mandalas en línea.
  Estructura de la macroestructura Workbench: panel de herramientas (nav) y
  lienzo (section). Los scripts se cargan en orden: motor → plantillas → app.
-->
<html lang="es">
  <head>
    <!-- Metadatos básicos: codificación, viewport móvil y descripción. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mandalas en l&iacute;nea</title>
    <meta
      name="description"
      content="Colorea mandalas generados proceduralmente en tu navegador y gu&aacute;rdalos en PNG o SVG o impr&iacute;melos."
    />

    <!-- Recursos: favicon, fuentes tipográficas y estilos del proyecto. -->
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;family=Instrument+Serif&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght@20..48,100..700&amp;display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="taller">
      <!-- Panel de herramientas: identidad, plantillas, colores y acciones. -->
      <nav class="panel panel--herramientas" aria-label="Herramientas de coloreado">
        <h1 class="panel__titulo">Mandalas</h1>
        <p class="panel__subtitulo">Colorea, guarda e imprime. Sin registro.</p>

        <!-- Selección de plantilla del catálogo (poblado por templates.js). -->
        <section class="herramientas__grupo">
          <h2 class="herramientas__caption">Plantilla</h2>
          <label class="sr-only" for="plantilla-select">Plantilla del mandala</label>
          <select id="plantilla-select" class="herramientas__select"></select>
        </section>

        <!-- Paleta predefinida y selector de color personalizado. -->
        <section class="herramientas__grupo">
          <h2 class="herramientas__caption">Colores</h2>
          <div id="paleta" class="paleta"></div>
          <label class="herramientas__personalizado">
            <span class="material-symbols-outlined" aria-hidden="true">palette</span>
            <span class="sr-only">Elegir color personalizado</span>
            <input
              id="color-input"
              type="color"
              class="herramientas__color"
              value="#e6454f"
            />
          </label>
        </section>

        <!-- Acciones: borrador, deshacer/rehacer, limpiar, imprimir y exportar. -->
        <section class="herramientas__grupo">
          <h2 class="herramientas__caption">Acciones</h2>
          <div class="herramientas__acciones">
            <button
              id="borrador-btn"
              type="button"
              class="herramienta"
              aria-label="Borrador (rellenar en blanco)"
              aria-pressed="false"
              title="Borrador"
            >
              <span class="material-symbols-outlined" aria-hidden="true">ink_eraser</span>
            </button>
            <button
              id="deshacer-btn"
              type="button"
              class="herramienta"
              aria-label="Deshacer &uacute;ltimo cambio"
              title="Deshacer"
              disabled
            >
              <span class="material-symbols-outlined" aria-hidden="true">undo</span>
            </button>
            <button
              id="rehacer-btn"
              type="button"
              class="herramienta"
              aria-label="Rehacer &uacute;ltimo cambio"
              title="Rehacer"
              disabled
            >
              <span class="material-symbols-outlined" aria-hidden="true">redo</span>
            </button>
            <button
              id="limpiar-btn"
              type="button"
              class="herramienta"
              aria-label="Limpiar todo el mandala"
              title="Limpiar todo"
            >
              <span class="material-symbols-outlined" aria-hidden="true"
                >cleaning_services</span
              >
            </button>
            <button
              id="imprimir-btn"
              type="button"
              class="herramienta"
              aria-label="Imprimir el mandala"
              title="Imprimir"
            >
              <span class="material-symbols-outlined" aria-hidden="true">print</span>
            </button>
            <button
              id="descargar-btn"
              type="button"
              class="herramienta"
              aria-label="Descargar el mandala en PNG"
              title="Descargar PNG"
            >
              <span class="material-symbols-outlined" aria-hidden="true">download</span>
            </button>
            <button
              id="descargar-svg-btn"
              type="button"
              class="herramienta"
              aria-label="Descargar el mandala en SVG"
              title="Descargar SVG"
            >
              <span class="material-symbols-outlined" aria-hidden="true">code</span>
            </button>
          </div>
        </section>

        <!-- Pie del panel (Web Mandala). -->
        <p class="panel__pie">Web Mandala</p>
      </nav>

      <!-- Lienzo: superficie del mandala, leyenda y barra de estado. -->
      <section class="panel panel--lienzo" aria-label="Mandala para colorear">
        <figure class="lienzo">
          <div id="mandala-contenedor" class="lienzo__superficie"></div>
          <figcaption id="lienzo-caption" class="lienzo__caption"></figcaption>
        </figure>
        <p id="estado" class="estado" role="status" aria-live="polite"></p>
      </section>
    </main>

    <!-- Motor → catálogo → lógica de interacción (este orden importa). -->
    <script src="js/mandala.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
